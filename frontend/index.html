<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockSense</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <h1>StockSense</h1>
        <button id="refreshBtn">Refresh Data</button>
      </header>

      <main class="dashboard">
        <section class="card overview">
          <h2>Market Snapshot</h2>
          <p id="statusText">Loading market status...</p>
          <div id="marketGrid" class="market-grid"></div>
        </section>

        <section class="card watchlist">
          <h2>Watchlist</h2>
          <table class="watchlist-table">
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Price</th>
                <th>Change</th>
                <th>%</th>
              </tr>
            </thead>
            <tbody id="watchlistTableBody"></tbody>
          </table>
        </section>

        <section class="card portfolio">
          <h2>Portfolio Summary</h2>
          <div class="portfolio-stats">
            <div>
              <span class="label">Total Value</span>
              <strong>$48,240.00</strong>
            </div>
            <div>
              <span class="label">Day Change</span>
              <strong class="positive">+$1,280.50</strong>
            </div>
            <div>
              <span class="label">Risk Score</span>
              <strong>Moderate</strong>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
