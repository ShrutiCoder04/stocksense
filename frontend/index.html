<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockSense</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <h1>StockSense</h1>
        <button id="refreshBtn">Refresh Data</button>
      </header>

      <main class="dashboard">
        <section class="card overview">
          <h2>Market Snapshot</h2>
          <p id="statusText">Loading market status...</p>
        </section>

        <section class="card watchlist">
          <h2>Watchlist</h2>
          <ul>
            <li>AAPL</li>
            <li>MSFT</li>
            <li>NVDA</li>
            <li>AMZN</li>
          </ul>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
